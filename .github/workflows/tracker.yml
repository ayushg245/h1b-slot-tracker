# Runs the tracker every 5 minutes on GitHub's free runners.
# GitHub may start scheduled runs late when it's busy (often 5 to 15 minutes, sometimes more).
# Free minutes: unlimited on a public repo; on a private repo every-5-minutes uses more
# than the free 2,000 minutes a month, so use a public repo or a longer schedule.
name: h1b-slot-tracker

on:
  schedule:
    # Offset from :00 because GitHub drops or delays many top-of-hour schedules.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test message to your alert channels"
        type: boolean
        default: false

concurrency:
  group: h1b-slot-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Remembers which reports already alerted, between runs.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: slots-state-${{ github.run_id }}
          restore-keys: slots-state-

      - name: Check for new reports
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ ! -f config.toml ]; then cp config.example.toml config.toml; fi
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python -m h1b_tracker --config config.toml test-alert
          else
            python -m h1b_tracker --config config.toml run
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: slots-state-${{ github.run_id }}
